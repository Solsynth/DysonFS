app = { name = "DysonFileSystem" }

[http]
port = "8080"

[grpc]
port = "9090"
useTLS = false
certFile = ""
keyFile = ""

[database]
dsn = "host=postgres port=5432 user=dyson password=dyson dbname=dyson_drive sslmode=disable"

[redis]
addr = "redis:6379"
db = 0

[nats]
url = "nats://nats:4222"

[storage]
tempDir = "/var/lib/dyson-drive/tmp"
localDir = "/var/lib/dyson-drive/data"

[bundled]
enable = false
worker_num = 1

[auth]
# Stargate gRPC endpoint (DyAuthService + DyPermissionService; took over the
# Padlock auth surface). It authenticates requests and authorizes uploads with
# the files.upload permission node. Stargate serves the fleet self-signed cert.
target = "stargate:9090"
useTLS = true
tlsSkipVerify = true

[workspace]
# WattEngine DyWorkspaceService endpoint. Required for workspace uploads.
target = ""
useTLS = false
tlsSkipVerify = false

[wallet]
# DysonNetwork Wallet DyPaymentService endpoint. Setting a target enables the
# golden-points quota purchase flow (see SPONSORED_POSTS.md precedent).
target = ""
useTLS = false
tlsSkipVerify = false

[quota.leveling]
level1 = 512
level10 = 1024
level60 = 5120
level120 = 10240

# Quantity-based golden-points quota purchase terms, sold via the [wallet]
# order flow.
[quota.purchase]
pricePerGB = "0.05" # decimal price per GB in the currency below
currency = "golds"  # Wallet currency; default "golds"
minGB = 1           # minimum GB per purchase
maxGB = 1024        # cap on total extra quota (purchases + admin grants); 0 = unlimited

[mode]
master = true
worker = true
storage = false

[files]
preferredStorage = "local"
gatewayUrl = "http://localhost:8080"
accessSecret = "change-me"

[wopi]
enabled = false
publicUrl = "https://files.example.com"
collaboraUrl = "https://collabora.example.com"
tokenTtl = "15m"
requireProof = false
proofCacheTtl = "1h"

[[pools]]
id = "01SYSTEMPOOLID00000000000000"
name = "system"
default = true
hidden = true

[pools.storage]
enableSigned = true
endpoint = "/var/lib/dyson-drive/data"
bucket = "local"

[pools.billing]

[pools.policy]
publicUsable = true
